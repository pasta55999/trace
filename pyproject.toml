[project]
name = "trace-platform"
version = "0.1.0"
description = "TRACE - UAE Climate Financial Risk Intelligence Platform (prototype slice) with self-evolving AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "shapely>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["services", "agents", "evolution", "apps"]
